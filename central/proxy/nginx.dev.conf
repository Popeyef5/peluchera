events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS + a variable in each proxy_pass makes nginx resolve
    # upstream container names at REQUEST time, not once at startup. Without it,
    # nginx refuses to start ("host not found in upstream ...") if any upstream
    # is down when the proxy boots — so one crashed dev container (e.g. next-admin
    # after a prune wipes its node_modules) takes the whole proxy down. With it,
    # the proxy stays up and only that one route 502s until the container is back,
    # and it also follows a restarted container's new IP instead of caching a
    # stale one. Mirrors the prod fix in nginx.conf.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── Admin subdomain ────────────────────────────────────────────────
    # admin.localhost (and admin.<lan-ip> via the wildcard below) routes to
    # the next-admin app for the UI and to fastapi for /admin/* API calls.
    # Local DNS resolves *.localhost to 127.0.0.1 on most setups; for LAN
    # access add an /etc/hosts entry like "192.168.0.237 admin.local".
    server {
        listen 80;
        server_name admin.localhost admin.*;

        location /admin/ {
            # No URI on proxy_pass: with a variable upstream, the request URI
            # (/admin/...) passes through unchanged — equivalent to the old
            # .../admin/ but re-resolved at runtime.
            set $up_api claw_fastapi:5000;
            proxy_pass http://$up_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            set $up_admin claw_next_admin:3001;
            proxy_pass http://$up_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }

    server {
        listen 80;
        server_name localhost;

        location /video_feed/ {
            set $up_media claw_media:8889;
            proxy_pass http://$up_media;   # passes /video_feed/... unchanged
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /video_api/ {
            # This route strips the /video_api/ prefix (-> /...). A variable
            # proxy_pass can't do prefix replacement, so rewrite explicitly.
            set $up_media_api claw_media:9997;
            rewrite ^/video_api/(.*)$ /$1 break;
            proxy_pass http://$up_media_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            set $up_next claw_next:3000;
            proxy_pass http://$up_next;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Disable buffering for streaming support
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }

    	location /socket.io/ {
            set $up_api claw_fastapi:5000;
            proxy_pass http://$up_api;   # passes /socket.io/... unchanged
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Disable buffering for streaming support
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }

    server {
        listen 80;
        server_name 192.168.0.237;

        location /video_feed/ {
            set $up_media claw_media:8889;
            proxy_pass http://$up_media;   # passes /video_feed/... unchanged
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            set $up_next claw_next:3000;
            proxy_pass http://$up_next;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Disable buffering for streaming support
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }

    	location /socket.io/ {
            set $up_api claw_fastapi:5000;
            proxy_pass http://$up_api;   # passes /socket.io/... unchanged
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Disable buffering for streaming support
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
